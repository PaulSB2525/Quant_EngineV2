# =============================================================================
# docker-compose.yml — Quant Engine v2 (Multi-Asset) — UNIFICADO LOCAL
# Optimizado para entornos Fedora con DNF5 y bypass de límites QuestDB
# =============================================================================

services:

  # ──────────────────────────────────────────────────────────────────────────
  # DATA TIER
  # ──────────────────────────────────────────────────────────────────────────

  questdb:
    image: questdb/questdb:7.4.0
    container_name: quant_questdb
    restart: unless-stopped
    ports:
      - "9000:9000"   # HTTP SQL console (Acceso: http://localhost:9000)
      - "9009:9009"   # ILP TCP — Ingesta masiva de ticks < 1ms
      - "8812:8812"   # PostgreSQL wire para lectura
    volumes:
      - questdb_data:/var/lib/questdb
    environment:
      QDB_SHARED_WORKER_COUNT: "2"
      QDB_HTTP_ENABLED: "true"
      QDB_PG_ENABLED: "true"
      QDB_TELEMETRY_ENABLED: "false"
      QDB_WAL_MAX_LAG_TXN_COUNT: "200"
      # ── BYPASS CRÍTICO MMAP FEDORA ──
      # CORRECCIÓN: QuestDB 7.x usa QDB_JAVA_OPTS, no JAVA_OPTS
      # Se añade -Xmx1200m para dejar margen de memoria nativa bajo el límite de 1500M del contenedor
      QDB_JAVA_OPTS: "-Dquestdb.experimental.mmap.disabled=false -Xmx1200m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 1500M
    healthcheck:
      # QuestDB 7.x expone el endpoint /health en el min-http server (puerto 9003), no en el 9000.
      # El puerto 9000 es el web console (static files); /health ahí devuelve 404.
      # No hay wget ni curl en la imagen — se usa bash /dev/tcp puro.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/localhost/9003 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q Healthy <&3"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: quant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command: >
      postgres
        -c shared_buffers=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c effective_cache_size=384MB
        -c max_connections=20
        -c wal_compression=on
        -c checkpoint_completion_target=0.9
        -c log_min_duration_statement=1000
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: quant_redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 200mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
        --save 900 1
        --save 300 10
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # ──────────────────────────────────────────────────────────────────────────
  # ENGINE — Bot Multi-Asset v2
  # ──────────────────────────────────────────────────────────────────────────

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: quant_bot
    restart: unless-stopped
    depends_on:
      questdb:  { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    env_file: .env
    environment:
      QUESTDB_HOST: questdb
      QUESTDB_ILP_PORT: "9009"
      # Remoción de la interpolación directa propensa a fallos de escape en bash/Fedora
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET}
      SYMBOLS: ${SYMBOLS}
      PAIR_SYMBOLS: ${PAIR_SYMBOLS}
      ALLOW_PRE_MARKET: ${ALLOW_PRE_MARKET}
      ALLOW_POST_MARKET: ${ALLOW_POST_MARKET}
      PAPER_TRADING: ${PAPER_TRADING}
      ENABLE_LLM_VALIDATION: ${ENABLE_LLM_VALIDATION}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ──────────────────────────────────────────────────────────────────────────
  # ADMIN PANEL — Streamlit v2 unificado localmente
  # ──────────────────────────────────────────────────────────────────────────

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: quant_dashboard
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SYMBOLS: ${SYMBOLS}
      PAIR_SYMBOLS: ${PAIR_SYMBOLS}
      ALLOW_PRE_MARKET: ${ALLOW_PRE_MARKET}
      ALLOW_POST_MARKET: ${ALLOW_POST_MARKET}
      AUTH_CONFIG_PATH: ${AUTH_CONFIG_PATH}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      AUTH_COOKIE_KEY: ${AUTH_COOKIE_KEY}
    ports:
      - "8501:8501"
    deploy:
      resources:
        limits:
          memory: 512M

# ──────────────────────────────────────────────────────────────────────────
# Volúmenes persistentes puros
# ──────────────────────────────────────────────────────────────────────────

volumes:
  questdb_data:
    driver: local
  pg_data:
    driver: local
  redis_data:
    driver: local
